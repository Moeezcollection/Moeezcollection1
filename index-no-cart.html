<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moeez Collection</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#faf8f5;color:#1f1f1f}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee}
.top{max-width:1200px;margin:auto;padding:16px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between}
.logo{font-size:24px;font-weight:800} nav{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}
.navbtn{background:#f2eee9} .navbtn.active{background:#222;color:#fff}
.hero{max-width:1200px;margin:25px auto;padding:35px 20px;text-align:center}
.hero h1{font-size:clamp(32px,5vw,58px);margin:0 0 10px} .hero p{color:#666}
.wrap{max-width:1200px;margin:auto;padding:0 20px 50px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input{flex:1;min-width:220px;padding:12px;border:1px solid #ddd;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #0000000b}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f5f1ed}
.info{padding:14px} .name{font-weight:700;min-height:42px} .price{font-size:20px;font-weight:800;margin:8px 0}
.small{font-size:13px;color:#777} .order{width:100%;background:#1f1f1f;color:#fff;margin-top:10px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px}
.panel{background:#fff;max-width:620px;margin:4vh auto;padding:22px;border-radius:18px;max-height:90vh;overflow:auto}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.form input,.form textarea{width:100%;margin:6px 0 12px}
textarea{min-height:90px;padding:12px;border:1px solid #ddd;border-radius:10px}
.checkout{background:#25D366;color:#fff;width:100%;margin-top:12px}
.close{float:right;background:#eee}
footer{text-align:center;padding:35px;color:#777}
</style>
</head>
<body>
<header><div class="top">
<div class="logo">Moeez Collection</div>
<nav>
<button class="navbtn active" onclick="filterCat('All',this)">All</button>
<button class="navbtn" onclick="filterCat('Clothes',this)">Clothes</button>
<button class="navbtn" onclick="filterCat('Shoes',this)">Shoes</button>
<button class="navbtn" onclick="filterCat('Jewelry',this)">Jewelry</button>
<button class="navbtn" onclick="filterCat('Bags',this)">Bags</button>
<button class="navbtn" onclick="filterCat('Watches',this)">Watches</button>
</nav>
</div></header>

<section class="hero"><h1>Shop Your Style</h1><p>Clothes • Shoes • Jewelry • Bags &nbsp; | &nbsp; Free delivery</p></section>

<main class="wrap">
<div class="toolbar">
<input id="search" placeholder="Search products..." oninput="render()">
<button class="navbtn" onclick="filterCat('All')">Show all</button>
</div>
<div id="grid" class="grid"></div>
</main>



<div id="modal" class="modal">
<div class="panel">
<button class="close" onclick="closeCart()">✕</button>
<h2>Your Order</h2>
<div id="cartItems"></div>
<hr>
<p><b>Total: Rs <span id="total">0</span></b></p>
<div class="form">
<label>Name</label><input id="customerName" placeholder="Your name">
<label>Phone</label><input id="customerPhone" placeholder="03xx xxxxxxx">
<label>Delivery address</label><textarea id="address" placeholder="Full delivery address"></textarea>
<button class="checkout" onclick="sendOrder()">Place Order on WhatsApp</button>
</div>
</div></div>

<footer>Free delivery • Orders confirmed through WhatsApp • Prices in Pakistani Rupees (PKR)</footer>

<script>
const WHATSAPP = "923305539198";
const products = [{"name": "Classic Shoulder Bag — Brown", "category": "Bags", "price": 1300, "delivery": "Free delivery", "image": "bag-brown.jpg"}, {"name": "Classic Shoulder Bag — Black", "category": "Bags", "price": 1300, "delivery": "Free delivery", "image": "bag-black.jpg"}, {"name": "Classic Shoulder Bag — Sage Green", "category": "Bags", "price": 1300, "delivery": "Free delivery", "image": "bag-green.jpg"}, {"name": "Classic Shoulder Bag — Burgundy", "category": "Bags", "price": 1300, "delivery": "Free delivery", "image": "bag-burgundy.jpg"}, {"name": "Classic Shoulder Bag — Beige", "category": "Bags", "price": 1300, "delivery": "Free delivery", "image": "bag-beige.jpg"}, {"name": "Classic Shoulder Bag — Lilac", "category": "Bags", "price": 1300, "delivery": "Free delivery", "image": "bag-lilac.jpg"}, {"name": "Classic Shoulder Bag — Light Blue", "category": "Bags", "price": 1300, "delivery": "Free delivery", "image": "bag-lightblue.jpg"}, {"name": "Classic Shoulder Bag — Tan", "category": "Bags", "price": 1300, "delivery": "Free delivery", "image": "bag-tan.jpg"}, {"name": "Classic Shoulder Bag — Navy", "category": "Bags", "price": 1300, "delivery": "Free delivery", "image": "bag-navy.jpg"}, {"name": "Classic Shoulder Bag — Pink", "category": "Bags", "price": 1300, "delivery": "Free delivery", "image": "bag-pink.jpg"}, {"name": "Moeez Collection ROSRA Silver Couple Watch", "category": "Watches", "price": 2100, "delivery": "Free delivery", "image": "1000386453.jpg"}, {"name": "Moeez Collection AB ONE Black Couple Watch", "category": "Watches", "price": 2100, "delivery": "Free delivery", "image": "1000386467.jpg"}, {"name": "Moeez Collection AB ONE Silver Couple Watch", "category": "Watches", "price": 2100, "delivery": "Free delivery", "image": "1000386452.jpg"}, {"name": "Moeez Collection Luxury Silver Stone Watch", "category": "Watches", "price": 2100, "delivery": "Free delivery", "image": "1000386454.jpg"}, {"name": "Moeez Collection Luxury Gold Stone Watch", "category": "Watches", "price": 2100, "delivery": "Free delivery", "image": "1000386469.jpg"}, {"name": "Moeez Collection AB ONE Gold Couple Watch", "category": "Watches", "price": 2100, "delivery": "Free delivery", "image": "1000386466.jpg"}, {"name": "Moeez Collection IEKE Women's Elegant Watch", "category": "Watches", "price": 2100, "delivery": "Free delivery", "image": "1000386462.jpg"}, {"name": "Moeez Collection Watch 8", "category": "Watches", "price": 2100, "delivery": "Free delivery", "image": "1000386464.jpg"}, {"name": "Moeez Collection Watch 9", "category": "Watches", "price": 2100, "delivery": "Free delivery", "image": "1000386468.jpg"}, {"name": "Moeez Collection ROSRA Silver Couple Watch0", "category": "Watches", "price": 2100, "delivery": "Free delivery", "image": "1000386465.jpg"}];
let category = "All";
let cart = [];

function filterCat(c, el) {
  category=c;
  document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));
  if(el) el.classList.add('active');
  render();
}
function render() {
  const q=document.getElementById('search').value.toLowerCase();
  const items=products.filter(p=>
    (category==="All" || p.category===category || (category!=="All" && p.category==="Bags" && category==="All")) &&
    p.name.toLowerCase().includes(q)
  );
  document.getElementById('grid').innerHTML=items.map((p,i)=>`
    <article class="card">
      <img src="${p.image}" alt="${p.name}">
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price">Rs ${p.price.toLocaleString()}</div>
        <div class="small">${p.delivery}</div>
        <button class="order" onclick="orderProduct(${products.indexOf(p)})">Order on WhatsApp</button>
      </div>
    </article>`).join('');
}
function orderProduct(i) {
  const p=products[i];
  const msg=`NEW WEBSITE ORDER%0A%0AProduct: ${encodeURIComponent(p.name)}%0APrice: Rs ${p.price.toLocaleString()}%0ADelivery: FREE`;
  window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,'_blank');
}

function sendOrder() {
  if(!cart.length) return alert('Please add a product first.');
  const name=document.getElementById('customerName').value.trim();
  const phone=document.getElementById('customerPhone').value.trim();
  const address=document.getElementById('address').value.trim();
  if(!name || !phone || !address) return alert('Please fill in your name, phone and delivery address.');
  const lines=cart.map((p,i)=>`${i+1}. ${p.name} — Rs ${p.price.toLocaleString()}`);
  const msg=`NEW WEBSITE ORDER%0A%0A${lines.join('%0A')}%0A%0ATotal: Rs ${(cart.length*1300).toLocaleString()}%0ADelivery: FREE%0A%0ACustomer: ${encodeURIComponent(name)}%0APhone: ${encodeURIComponent(phone)}%0AAddress: ${encodeURIComponent(address)}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, '_blank');
}
render();
</script>
<div>Free Delivery</div></body></html>
